[package]
name = "clipboard_super_evolution"
version = "0.1.0"
edition = "2021"
description = "AI-powered clipboard manager for Windows"
authors = ["Developer"]

[dependencies]
# GUI
eframe = "0.30"
egui = "0.30"

# Clipboard
arboard = "3.4"

# System tray
tray-icon = "0.19"

# Global hotkey
global-hotkey = "0.6"

# Async Runtime
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regex for pattern matching
regex = "1.11"

# Environment variables
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# URL encoding
urlencoding = "2.1"

# Image for icon
image = "0.25"

# Open URLs in default browser
open = "5.3"

# Windows specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell"
]}
winit = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "clipboard_super_evolution"
path = "src/main.rs"

[[bin]]
name = "export_icon"
path = "src/export_icon.rs"
